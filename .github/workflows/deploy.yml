name: Build and Push Microservices

# Yeh pipeline tab chalega jab tu 'main' branch pe push karega
on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    # Matrix strategy: Hum ek saath saari services build karenge
    strategy:
      matrix:
        service: [auth-service, room-service, execution-service, api-gateway]
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # GitHub automatically provides a token to push images
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v5
        with:
          context: ./services/${{ matrix.service }}
          push: true
          # Image ka naam: ghcr.io/username/repo/service-name:latest
          tags: ghcr.io/${{ github.repository }}/${{ matrix.service }}:latest
          # Caching use karenge taaki build fast ho
          cache-from: type=gha
          cache-to: type=gha,mode=max