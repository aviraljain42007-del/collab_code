name: Build and Push Microservices

on:
  push:
    branches: [ "main" ]

# 👇 Yeh permissions GHCR mein push karne ke liye sabse zaroori hain
permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    # Matrix strategy: Saari 4 services parallel mein build hongi
    strategy:
      matrix:
        service: [auth-service, room-service, execution-service, api-gateway]
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # GITHUB_TOKEN use kar rahe hain kyunki upar permissions likhi hain
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v5
        with:
          context: ./services/${{ matrix.service }}
          push: true
          tags: ghcr.io/${{ github.repository }}/${{ matrix.service }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max