worker_processes 1;

events { worker_connections 1024; }

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # ── 1. WebSocket Upgrade Map (Sabse Zaroori) ──
    # Ye Nginx ko batata hai ki jab browser "Upgrade" header bheje, 
    # toh connection ko "upgrade" karna hai, warna "close".
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ── 2. Backend Services ke Upstreams ──
    upstream api_gateway {
        server api-gateway:3000;
    }

    upstream room_service {
        server room-service:3002;
    }

    # ── 3. Main Server Block ──
    server {
        listen 80;
        server_name localhost;

        # ── A. Socket.io Routing (Room Service) ──
        # Frontend jab ws://localhost/socket.io/ hit karega, toh ye block chalega
        location /socket.io/ {
            proxy_pass http://room_service;
            
            # WebSocket Handshake ke liye zaroori headers
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            
            # Client ki details forward karo
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            
            # Timeout badhao taaki connection jaldi band na ho
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # ── B. REST API Routing (API Gateway) ──
        # Baaki saari requests (jaise /api/v1/...) Gateway ko jayengi
        location / {
            proxy_pass http://api_gateway;
            
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}