services:
  # ── Databases & Brokers ──
  redis:
    image: redis:7-alpine
    container_name: collabcode-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  kafka:
    image: apache/kafka:3.7.0
    container_name: collabcode-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@localhost:29093'
      KAFKA_LISTENERS: 'CONTROLLER://:29093,PLAINTEXT_HOST://:9092,PLAINTEXT://:19092'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT_HOST://localhost:9092,PLAINTEXT://kafka:19092'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: '4L6g3nShT-eMCtK--X86sw'
    restart: unless-stopped

  # ── Microservices ──
  auth-service:
    build: ./services/auth-service
    container_name: collabcode-auth
    env_file: ./services/auth-service/.env
    restart: unless-stopped
    depends_on:
      - redis

  room-service:
    build: ./services/room-service
    container_name: collabcode-room
    env_file: ./services/room-service/.env
    restart: unless-stopped
    depends_on:
      - redis

  runner-service:
    build: ./services/runner-service
    container_name: collabcode-runner
    restart: unless-stopped

  execution-service:
    build: ./services/execution-service
    container_name: collabcode-execution
    env_file: ./services/execution-service/.env
    # volumes:
    #   - /var/run/docker.sock:/var/run/docker.sock # Ab iski zaroorat nahi hai
    restart: unless-stopped
    depends_on:
      - redis
      - kafka
      - runner-service # Add kiya

  api-gateway:
    build: ./services/api-gateway
    container_name: collabcode-gateway
    env_file: ./services/api-gateway/.env
    restart: unless-stopped
    depends_on:
      - auth-service
      - room-service
      - execution-service

  # ── Reverse Proxy (Load Balancer) ──
  nginx:
    build: ./nginx
    container_name: collabcode-nginx
    ports:
      - "80:80"
    restart: unless-stopped
    depends_on:
      - api-gateway

      